[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
packages = ["src/sandbox_api_mcp_server"]

[project]
name = "sandbox-api-mcp-server"
version = "1.1.0"
description = "Sandbox API tool for FastMCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Rafal Janicki", email = "rafal.janicki@neo4j.com" }
]
dependencies = [
    "cryptography>=46.0.7,<47.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "fastmcp>=3.2.0,<4.0.0",
    "httpx>=0.28.1,<1.0.0",
    "PyJWT>=2.12.0,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "pydantic>=2.11.4,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
sandbox-api-mcp-server = "sandbox_api_mcp_server:server.run"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "respx>=0.21,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]